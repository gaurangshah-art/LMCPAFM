# Oracle Cloud (OCI) staging/production override.
# Usage:
#   docker compose -f compose.yaml -f compose.postgres.yaml -f compose.prod.yaml -f compose.oracle.yaml --env-file .env up -d --build

services:
  backend:
    ports: !override
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ${LMCPAFM_DATA_DIR:-/opt/lmcpafm/data}:/data
    environment:
      # Host bind uses ${PORT} in ports above; app always listens on 8000 in-container.
      PORT: 8000
      FORMB_ATTACHMENT_DIR: /data/form_b_attachments
      LMCP_LOGO_PATH: /app/static/branding/lmcp-logo.png

  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PROD_PORT:-8080}:80"

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
